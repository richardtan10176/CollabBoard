<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket Connection Test</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e8; color: #2e7d32; }
        .info { background: #e3f2fd; color: #1565c0; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        input { padding: 8px; margin: 5px; width: 200px; }
    </style>
</head>
<body>
    <h1>Socket Connection Test</h1>
    
    <div>
        <input type="text" id="tokenInput" placeholder="Enter JWT token" />
        <button onclick="connect()">Connect</button>
        <button onclick="disconnect()">Disconnect</button>
    </div>
    
    <div>
        <input type="text" id="documentIdInput" placeholder="Document ID" value="8997808e-b62b-4377-a503-8eeeac262498" />
        <button onclick="joinDocument()">Join Document</button>
        <button onclick="leaveDocument()">Leave Document</button>
    </div>
    
    <div>
        <input type="text" id="textInput" placeholder="Text to send" value="Hello World!" />
        <button onclick="sendTextChange()">Send Text Change</button>
    </div>
    
    <div>
        <input type="number" id="positionInput" placeholder="Cursor position" value="5" />
        <button onclick="sendCursorMove()">Send Cursor Move</button>
    </div>
    
    <div id="status" class="log info">Not connected</div>
    <div id="logs"></div>

    <script>
        let socket = null;
        let currentDocumentId = null;

        function log(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const logDiv = document.createElement('div');
            logDiv.className = `log ${type}`;
            logDiv.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            logsDiv.appendChild(logDiv);
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        function updateStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `log ${type}`;
            statusDiv.textContent = message;
        }

        function connect() {
            const token = document.getElementById('tokenInput').value;
            if (!token) {
                log('Please enter a JWT token', 'error');
                return;
            }

            if (socket) {
                socket.disconnect();
            }

            socket = io('/', {
                auth: { token },
                transports: ['polling', 'websocket'],
                path: '/socket.io/',
                timeout: 20000,
                reconnection: true,
                reconnectionAttempts: 5,
                reconnectionDelay: 1000,
                autoConnect: true,
            });

            socket.on('connect', () => {
                log('Connected to server with ID: ' + socket.id, 'success');
                updateStatus('Connected - ID: ' + socket.id, 'success');
            });

            socket.on('disconnect', (reason) => {
                log('Disconnected from server. Reason: ' + reason, 'error');
                updateStatus('Disconnected', 'error');
            });

            socket.on('connect_error', (error) => {
                log('Connection error: ' + error.message, 'error');
                updateStatus('Connection Error', 'error');
            });

            socket.on('document-joined', (data) => {
                log('Document joined: ' + JSON.stringify(data, null, 2), 'success');
                currentDocumentId = data.document.id;
            });

            socket.on('text-changed', (data) => {
                log('Text changed by ' + data.user.username + ': ' + data.content.substring(0, 50) + '...', 'info');
            });

            socket.on('cursor-moved', (data) => {
                log('Cursor moved by ' + data.user.username + ' to position ' + data.position, 'info');
            });

            socket.on('user-joined', (data) => {
                log('User joined: ' + data.user.username, 'success');
            });

            socket.on('user-left', (data) => {
                log('User left: ' + data.user.username, 'info');
            });

            socket.on('error', (error) => {
                log('Socket error: ' + error.message, 'error');
            });
        }

        function disconnect() {
            if (socket) {
                socket.disconnect();
                socket = null;
                currentDocumentId = null;
                updateStatus('Disconnected', 'error');
            }
        }

        function joinDocument() {
            const documentId = document.getElementById('documentIdInput').value;
            if (!socket || !socket.connected) {
                log('Not connected to server', 'error');
                return;
            }
            if (!documentId) {
                log('Please enter a document ID', 'error');
                return;
            }
            
            log('Joining document: ' + documentId, 'info');
            socket.emit('join-document', documentId);
        }

        function leaveDocument() {
            if (!socket || !socket.connected) {
                log('Not connected to server', 'error');
                return;
            }
            if (!currentDocumentId) {
                log('Not in any document', 'error');
                return;
            }
            
            log('Leaving document: ' + currentDocumentId, 'info');
            socket.emit('leave-document', currentDocumentId);
            currentDocumentId = null;
        }

        function sendTextChange() {
            const text = document.getElementById('textInput').value;
            if (!socket || !socket.connected) {
                log('Not connected to server', 'error');
                return;
            }
            if (!currentDocumentId) {
                log('Not in any document', 'error');
                return;
            }
            
            log('Sending text change: ' + text, 'info');
            socket.emit('text-change', {
                documentId: currentDocumentId,
                content: text,
                operation: null
            });
        }

        function sendCursorMove() {
            const position = parseInt(document.getElementById('positionInput').value);
            if (!socket || !socket.connected) {
                log('Not connected to server', 'error');
                return;
            }
            if (!currentDocumentId) {
                log('Not in any document', 'error');
                return;
            }
            
            log('Sending cursor move to position: ' + position, 'info');
            socket.emit('cursor-move', {
                documentId: currentDocumentId,
                position: position
            });
        }
    </script>
</body>
</html>
